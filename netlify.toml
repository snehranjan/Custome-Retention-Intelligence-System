# Netlify Configuration for RetainIQ Customer Retention Intelligence System
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Handle Single Page Application (SPA) routing for React/Vite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
